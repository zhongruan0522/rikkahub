name: Latest Build

on:
  # 主分支每次 push 都构建
  push:
    branches: [master]
  # 也支持手动触发
  workflow_dispatch:

# 连续 push 时取消仍在运行的旧构建，只保留最新一次
concurrency:
  group: latest-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # 发布 Release 需要写权限

    steps:
      - uses: actions/checkout@v4

      # 与 Android Studio 自带的 JetBrains Runtime 21 保持一致
      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'jetbrains'
          java-version: '21'
        env:
          # jetbrains 安装器通过 GitHub API 查询版本，带上 token 避免被限流
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # web 模块的 preBuild 会执行 `pnpm run build` 构建前端，必须准备好 Node + pnpm
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web-ui/pnpm-lock.yaml

      # gradle 的 buildWebUi 任务只跑 build 不跑 install，需在此提前安装依赖
      - name: Install web-ui dependencies
        working-directory: web-ui
        run: pnpm install --frozen-lockfile

      - name: Gradle cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}

      - name: Prepare build files
        run: |
          # 解码base64编码的keystore文件
          echo "${{ secrets.KEY_BASE64 }}" | base64 -d > app/app.key

          # 写入签名配置到local.properties
          echo "${{ secrets.SIGNING_CONFIG }}" > local.properties

          # 写入Google Services配置
          echo '${{ secrets.GOOGLE_SERVICES_JSON }}' > app/google-services.json

      - name: Gradle Build
        run: |
          chmod +x gradlew
          ./gradlew assembleGithubDebug assembleGithubRelease

      # 记录构建时间（北京时间），用作 Release 正文
      - name: Get build time
        id: build_time
        run: echo "time=$(TZ='Asia/Shanghai' date '+%Y-%m-%d %H:%M:%S')" >> "$GITHUB_OUTPUT"

      # 删除上一次的 Latest Release 及其 tag，实现 Release 和产物的完全覆盖
      - name: Delete old release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release delete Latest --yes --cleanup-tag || true

      # 重新创建 Latest Prerelease，tag 指向本次 commit
      - name: Publish Latest prerelease
        uses: softprops/action-gh-release@v2
        if: success()
        with:
          tag_name: Latest
          name: Latest
          prerelease: true
          body: |
            构建时间：${{ steps.build_time.outputs.time }}

            > ⚠️ 开发版本，可能不稳定，仅供测试。
          # mapping.txt 用于还原混淆后的崩溃堆栈，所有 ABI 的 APK 共用这一份
          files: |
            app/build/outputs/apk/github/debug/*.apk
            app/build/outputs/apk/github/release/*.apk
            app/build/outputs/mapping/githubRelease/mapping.txt
