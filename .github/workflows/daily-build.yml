name: Latest Build

on:
  # 主分支每次 push 都构建；纯文档/AI 配置等与构建无关的改动除外。
  # paths-ignore 仅在 push 的所有改动文件都命中忽略规则时才跳过，
  # 因此"业务代码 + 文档"混合提交仍会正常触发构建
  push:
    branches: [master]
    paths-ignore:
      - '**.md'          # AGENTS.md、README、CHANGELOG 等文档
      - 'docs/**'        # 文档目录
      - 'LICENSE'
      - '.gitignore'
      - '.gitattributes'
      - '.agents/**'     # AI 协作配置
      - '.claude/**'
      - '.github/**'     # CI 配置；改动工作流后可用 workflow_dispatch 手动触发验证
  # 也支持手动触发
  workflow_dispatch:

# 连续 push 时取消仍在运行的旧构建，只保留最新一次
concurrency:
  group: latest-build
  cancel-in-progress: true

jobs:
  # Debug 与 Release 两个变体并行构建，publish 等两者完成后汇总发布
  build-debug:
    name: Build Debug APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # 与 Android Studio 自带的 JetBrains Runtime 21 保持一致
      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          distribution: 'jetbrains'
          java-version: '21'
        env:
          # jetbrains 安装器通过 GitHub API 查询版本，带上 token 避免被限流
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # web 模块的 preBuild 会执行 `pnpm run build` 构建前端，必须准备好 Node + pnpm
      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web-ui/pnpm-lock.yaml

      # gradle 的 buildWebUi 任务只跑 build 不跑 install，需在此提前安装依赖
      - name: Install web-ui dependencies
        working-directory: web-ui
        run: pnpm install --frozen-lockfile

      # 自动缓存 GRADLE_USER_HOME 与 configuration-cache，配合 --build-cache 复用任务输出
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      # debug 变体使用默认 debug 签名，无需 keystore，只需 Google Services 配置
      - name: Prepare build files
        run: echo '${{ secrets.GOOGLE_SERVICES_JSON }}' > app/google-services.json

      - name: Gradle Build
        run: |
          chmod +x gradlew
          ./gradlew --build-cache assembleGithubDebug

      - name: Upload debug APKs
        uses: actions/upload-artifact@v7
        with:
          name: apk-github-debug
          path: app/build/outputs/apk/github/debug/*.apk
          if-no-files-found: error

  build-release:
    name: Build Release APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # 与 Android Studio 自带的 JetBrains Runtime 21 保持一致
      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          distribution: 'jetbrains'
          java-version: '21'
        env:
          # jetbrains 安装器通过 GitHub API 查询版本，带上 token 避免被限流
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # web 模块的 preBuild 会执行 `pnpm run build` 构建前端，必须准备好 Node + pnpm
      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web-ui/pnpm-lock.yaml

      # gradle 的 buildWebUi 任务只跑 build 不跑 install，需在此提前安装依赖
      - name: Install web-ui dependencies
        working-directory: web-ui
        run: pnpm install --frozen-lockfile

      # 自动缓存 GRADLE_USER_HOME 与 configuration-cache，配合 --build-cache 复用任务输出
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Prepare build files
        run: |
          # 解码 base64 编码的 keystore 文件
          echo "${{ secrets.KEY_BASE64 }}" | base64 -d > app/app.key

          # 写入签名配置到 local.properties
          echo "${{ secrets.SIGNING_CONFIG }}" > local.properties

          # 写入 Google Services 配置
          echo '${{ secrets.GOOGLE_SERVICES_JSON }}' > app/google-services.json

      - name: Gradle Build
        run: |
          chmod +x gradlew
          ./gradlew --build-cache assembleGithubRelease

      - name: Upload release APKs
        uses: actions/upload-artifact@v7
        with:
          name: apk-github-release
          path: app/build/outputs/apk/github/release/*.apk
          if-no-files-found: error

      # mapping.txt 用于还原混淆后的崩溃堆栈，所有 ABI 的 APK 共用这一份
      - name: Upload release mapping
        uses: actions/upload-artifact@v7
        with:
          name: mapping-github-release
          path: app/build/outputs/mapping/githubRelease/mapping.txt
          if-no-files-found: error

  publish:
    name: Publish Latest Release
    runs-on: ubuntu-latest
    needs: [build-debug, build-release]
    permissions:
      contents: write   # 发布 Release 需要写权限
    steps:
      # 合并下载两个构建 job 的产物到 dist/（APK + mapping.txt，均为平铺文件）
      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      # 记录构建时间（北京时间），用作 Release 正文
      - name: Get build time
        id: build_time
        run: echo "time=$(TZ='Asia/Shanghai' date '+%Y-%m-%d %H:%M:%S')" >> "$GITHUB_OUTPUT"

      # 删除上一次的 Latest Release 及其 tag，实现 Release 和产物的完全覆盖
      - name: Delete old release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: gh release delete Latest --yes --cleanup-tag || true

      # 重新创建 Latest Prerelease，tag 指向本次 commit
      - name: Publish Latest prerelease
        uses: softprops/action-gh-release@v3
        with:
          tag_name: Latest
          name: Latest
          prerelease: true
          body: |
            构建时间：${{ steps.build_time.outputs.time }}

            > ⚠️ 开发版本，可能不稳定，仅供测试。
          files: dist/*
